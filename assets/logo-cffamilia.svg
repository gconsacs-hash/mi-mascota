<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7f96"/>
      <stop offset="1" stop-color="#4f9ff5"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dentroCorazon">
      <path d="M60 99 C 33 81, 19 66, 19 47 C 19 33, 30 24, 42 24 C 50 24, 56 28, 60 36 C 64 28, 70 24, 78 24 C 90 24, 101 33, 101 47 C 101 66, 87 81, 60 99 Z"/>
    </clipPath>
  </defs>

  <!-- Medalla -->
  <circle cx="60" cy="60" r="56" fill="url(#fondo)"/>
  <circle cx="60" cy="60" r="56" fill="url(#brillo)"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>

  <!-- Corazón -->
  <path d="M60 99 C 33 81, 19 66, 19 47 C 19 33, 30 24, 42 24 C 50 24, 56 28, 60 36 C 64 28, 70 24, 78 24 C 90 24, 101 33, 101 47 C 101 66, 87 81, 60 99 Z" fill="#fff"/>

  <!-- La familia: papá y mamá atrás, hija mayor e hijo menor adelante -->
  <g clip-path="url(#dentroCorazon)">
    <!-- Papá -->
    <g fill="#4f9ff5">
      <circle cx="40" cy="44" r="8.5"/>
      <path d="M26 68 C 26 55, 54 55, 54 68 L 54 72 L 26 72 Z"/>
    </g>
    <!-- Mamá (con moños) -->
    <g fill="#ff7f96">
      <circle cx="80" cy="44" r="8.5"/>
      <circle cx="72" cy="40" r="3.2"/>
      <circle cx="88" cy="40" r="3.2"/>
      <path d="M66 68 C 66 55, 94 55, 94 68 L 94 72 L 66 72 Z"/>
    </g>
    <!-- Hija mayor (con coletas), borde blanco para separarla del fondo -->
    <g fill="#b58cff" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" paint-order="stroke">
      <circle cx="51" cy="63" r="6.8"/>
      <circle cx="44" cy="65" r="2.8"/>
      <circle cx="58" cy="65" r="2.8"/>
      <path d="M40 84 C 40 72, 62 72, 62 84 L 62 88 L 40 88 Z"/>
    </g>
    <!-- Hijo menor (el más pequeño) -->
    <g fill="#ffd23f" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" paint-order="stroke">
      <circle cx="70" cy="68" r="5.8"/>
      <path d="M61 86 C 61 76, 79 76, 79 86 L 79 90 L 61 90 Z"/>
    </g>
  </g>
</svg>
